<!DOCTYPE html>
<html>
 
<body>

<title>Actors</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4">
    <h2>Actors by Dau</h2>

    <form>
        <div class="mb-3">
        <label for="actor" class="form-label">Peter Pan</label>
        <input type ="password" id="actor" value="Robin Williams" class="form-control"> <br>
        </div>

        <div class="mb-3">
        <label for="guess" class="form-label">Who is the actor </label>
        <input type ="text" id="guess" class="form-control"> <br>
        </div>

        <input type="button" id="guessButton" onclick="checkActor()" value="Check the guess" class="btn-primary">

    </form>


    <div id="result">Correct: 0 | Incorrect: 0</div>
</div>

<script> 

let correct = 0;
let notCorrect = 0;

function checkActor (){
    console.log("Checking actor guess")
    actor = document.getElementById("actor").value
    guess = document.getElementById("guess").value

    function tooManyGuesses(){
    alert("too many guesses have been attempted.");
    }

    
    if(actor == guess){
        correct++
        alert("That's right")
    } else {
        notCorrect++
        alert("Better luck next time")
        if(notCorrect > 10){
            document.getElementById("guessButton").onclick = tooManyGuesses;
        }
        
    }

    
    
    out = document.getElementById("result")
    out.innerHTML = "Correct: " + correct + " | Incorrect: " + notCorrect
}
</script>

<div class="container">
  <div class="row">
    <div class="col-md-4">
      <img src="Apple.jpg" class="img-fluid" height="150" width="150"
      alt="SlideShow image"
      data-value="1"
      onclick="updatePic(this)">


    </div>
    <div class="col-md-4">
      <img src="Mango.jpg" class="img-fluid" height="150" width="150"
      alt="SlideShow image"
      data-value="2"
      onclick="updatePic(this)">
    </div>
    <div class="col-md-4">
      <img src="BiscutDonuts.webp" class="img-fluid" height="150" width="150"
      alt="SlideShow image"
      data-value="3"
      onclick="updatePic(this)">
    </div>
  </div>
</div>

<script>
    let usePic = 1;

    function updatePic(imgElement){
        usePic = parseInt(imgElement.getAttribute("data-value"));

        switch(usePic){
            case 1:
                imgElement.src = "BiscutDonuts.webp";
                imgElement.setAttribute("data-value", "2");
                break; 
            
            case 2:
                imgElement.src = "Mango.jpg";
                imgElement.setAttribute("data-value", "3");
                break;

            case 3:
                imgElement.src = "Apple.jpg";
                imgElement.setAttribute("data-value", "1")
                break;

        }
    }
</script>







</body>
</html>
